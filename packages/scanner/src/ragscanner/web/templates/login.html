<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAGScanner · Sign in</title>
  <link rel="stylesheet" href="/dashboard-assets/dashboard.css?v={{ asset_version }}">
  <script defer src="/dashboard-assets/dashboard-i18n.js?v={{ asset_version }}"></script>
</head>
<body>
  <main class="setup-shell">
    <a class="wordmark" href="/">RAG<span>Scanner</span></a>
    <section class="setup-card">
      <label class="language-picker login-language"><span>Language</span><select data-language-picker aria-label="Language"><option value="en">English</option><option value="tr">Türkçe</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="zh-CN">简体中文</option><option value="it">Italiano</option></select></label>
      <p class="eyebrow">Machine-local dashboard</p>
      <h1>Sign in</h1>
      <p>Use the administrator account created during local setup.</p>
      {% if error %}<p class="notice" role="alert">{{ error }}</p>{% endif %}
      <form method="post" class="scan-form">
        <label>Username<input name="username" required autocomplete="username"></label>
        <label>Passphrase<input type="password" name="password" required autocomplete="current-password"></label>
        <button class="primary full" type="submit">Sign in</button>
      </form>
    </section>
  </main>
</body>
</html>
