name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv==0.11.28
      - name: Sync
        run: uv sync --frozen
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Package and report smoke
        run: |
          uv build
          uv run ragscanner scan examples/sample-kb --quiet --format json --output /tmp/ragscanner-ci-report.json
      - name: Local Markdown links
        run: |
          uv run python - <<'PY'
          import re
          from pathlib import Path
          broken = []
          for path in Path('.').rglob('*.md'):
              if any(part in {'.venv', 'graphify-out', 'dist'} for part in path.parts):
                  continue
              for target in re.findall(r'\[[^\]]+\]\(([^)]+)\)', path.read_text(errors='ignore')):
                  if target.startswith(('http://', 'https://', '#', 'mailto:')):
                      continue
                  local = target.split('#', 1)[0]
                  if local and not (path.parent / local).resolve().exists():
                      broken.append(f'{path}: {target}')
          if broken:
              raise SystemExit('\n'.join(broken))
          PY

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    # The root commit intentionally has no dependency manifests, so GitHub cannot build a
    # comparison graph for the initial baseline PR. Every later PR runs dependency review.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.sha != '6fdadd0d27e08d0c6798aeb46dacc9fa87ed281d'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
