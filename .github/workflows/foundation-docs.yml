name: Foundation documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  required-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify foundation files and issue drafts
        shell: bash
        run: |
          set -euo pipefail
          required=(AGENTS.md README.md README.tr.md README.de.md README.fr.md README.zh-CN.md README.it.md PRODUCT.md ARCHITECTURE.md FEATURES.md SECURITY.md PRIVACY.md CONTRIBUTING.md SUPPORT.md CHANGELOG.md ROADMAP.md PLANS.md LICENSE_DECISION.md DEPLOYMENT.md OPENWEBUI_INTEGRATION.md BYOM.md WEBSITE.md TESTING.md RELEASES.md docs/status/current.md)
          for file in "${required[@]}"; do
            test -s "$file"
          done
          test "$(find docs/issues -maxdepth 1 -name 'RS-*.md' | wc -l | tr -d ' ')" -ge "60"
          test "$(find docs/decisions -maxdepth 1 -name '[0-9][0-9][0-9][0-9]-*.md' | wc -l | tr -d ' ')" -ge "1"
