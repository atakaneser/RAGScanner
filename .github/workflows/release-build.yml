name: Release build verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.28
      - name: Sync and verify
        run: |
          uv sync --frozen
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
      - name: Build wheel and source distribution
        run: uv build
      - name: Clean wheel smoke test
        run: |
          uv venv /tmp/ragscanner-wheel
          uv pip install --python /tmp/ragscanner-wheel/bin/python dist/*.whl
          /tmp/ragscanner-wheel/bin/ragscanner --version
          /tmp/ragscanner-wheel/bin/ragscanner scan examples/sample-kb --quiet --format json --output /tmp/ragscanner-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ragscanner-alpha-build
          path: dist/*
          if-no-files-found: error
