name: Feature request
description: Propose a product outcome or detector improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and affected user
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome and evidence
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Likely area
      options: ["Core/CLI", "Connector/API", "Operations", "Website/docs", "Unknown"]
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Security, privacy, compatibility, and false-positive risks
  - type: checkboxes
    id: data
    attributes:
      label: Data check
      options:
        - label: This request contains no customer content, secrets, personal data, or private access details.
          required: true
