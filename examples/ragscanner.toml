[scan]
recursive = true
include = ["**/*.txt", "**/*.md", "**/*.pdf", "**/*.docx"]
exclude = ["**/archive/**"]
max_file_size_mb = 25
max_files = 10000

[security]
enabled = true
include_pii = false
minimum_severity = "low"

[chunking]
strategy = "structure_aware"
target_tokens = 300
max_tokens = 500
min_tokens = 50
overlap_tokens = 30

[rag]
profile = "general_qa"
embedding_context_tokens = 8192
generator_context_tokens = 32768
retrieval_top_k = 5

[scoring]
version = "1.0.0"
security_weight = 0.35
knowledge_quality_weight = 0.20
efficiency_weight = 0.15
critical_security_cap = 54.99
minimum_assessed_dimensions = 2

[duplicates]
exact = true
near = true
similarity_threshold = 0.82

[limits]
pdf_max_pages = 1000
pdf_max_characters = 5000000
docx_max_characters = 5000000
normalized_max_characters = 5000000
max_chunks_per_document = 10000

[report]
format = "terminal"
show_relative_paths = true
max_findings = 500
overwrite = false
create_parent_directories = false
