[project]
name = "ragscanner"
dynamic = ["version"]
description = "Local-first, open-source RAG health and security scanner"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
authors = [{name = "RAGScanner contributors"}]
keywords = ["rag", "security", "scanner", "llm", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.27,<1",
  "pymupdf>=1.24,<2",
  "python-docx>=1.2,<2",
  "defusedxml>=0.7,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "structlog>=24.4,<26",
  "typer>=0.12,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "platformdirs>=4.3,<5",
  "pypdf>=6,<7",
]

[project.urls]
Homepage = "https://github.com/atakaneser/RAGScanner"
Repository = "https://github.com/atakaneser/RAGScanner"
Issues = "https://github.com/atakaneser/RAGScanner/issues"
Documentation = "https://github.com/atakaneser/RAGScanner#readme"

[project.scripts]
ragscanner = "ragscanner.cli:app"

[dependency-groups]
dev = [
  "jsonschema>=4.23,<5",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "types-defusedxml>=0.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/scanner/src/ragscanner"]

[tool.hatch.version]
path = "packages/scanner/src/ragscanner/version.py"

[tool.hatch.build.targets.wheel.force-include]
"rules/static" = "ragscanner/rules/static"
"schemas/report/ragscanner-report-v1.schema.json" = "ragscanner/schemas/report/ragscanner-report-v1.schema.json"

[tool.hatch.build.targets.sdist]
include = [
  "/packages",
  "/rules",
  "/schemas",
  "/docs",
  "/examples/sample-kb",
  "/README.md",
  "/README.tr.md",
  "/README.de.md",
  "/README.fr.md",
  "/README.zh-CN.md",
  "/README.it.md",
  "/LICENSE",
  "/SECURITY.md",
  "/CHANGELOG.md",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["E501", "RUF001", "S101", "S104"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ragscanner"]
mypy_path = "packages/scanner/src"
